name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug + run unit tests
        run: |
          ./gradlew :app:assembleDebug :app:testDebugUnitTest \
            --no-daemon --console=plain --stacktrace

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  instrumented:
    name: runtime smoke (emulator API 26)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install system image and create AVD
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "y" | sdkmanager "system-images;android-26;default;x86" "emulator" "platform-tools" > /dev/null
          echo "no" | avdmanager create avd -n ci -k "system-images;android-26;default;x86" --force

      - name: Boot emulator (software emulation, no KVM on hosted runners)
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -accel off -gpu swiftshader_indirect -memory 1536 > /tmp/emu.log 2>&1 &
          adb wait-for-device
          BOOTED=0
          for i in $(seq 1 120); do
            v=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "boot poll $i: [$v]"
            if [ "$v" = "1" ]; then echo "EMULATOR_BOOTED"; BOOTED=1; break; fi
            sleep 10
          done
          if [ "$BOOTED" != "1" ]; then echo "EMULATOR BOOT TIMEOUT"; tail -40 /tmp/emu.log; exit 1; fi
          adb shell input keyevent 82 || true

      - name: Instrumented smoke tests (real Android runtime)
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: /tmp/emu.log
          if-no-files-found: ignore